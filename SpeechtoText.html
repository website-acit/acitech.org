<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoscribe - Speech to Text with Timestamp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f8;
            color: #333;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        #instructions {
            color: #777;
            margin-bottom: 15px;
            font-style: italic;
        }

        #live-transcript-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        #live-transcript-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        #transcript-display {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.5;
        }

        .transcript-entry {
            margin-bottom: 8px;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-right: 10px;
        }

        #date-display {
            color: #777;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Chronoscribe</h1>
    <div class="controls">
        <button id="startButton">Start Listening</button>
        <button id="stopButton" disabled>Stop Listening</button>
    </div>
    <p id="instructions">Press 'Start Listening' to begin.</p>
    <div id="live-transcript-container">
        <div id="date-display"></div>
        <div id="live-transcript-title">Live Transcript with Timestamps</div>
        <div id="transcript-display"></div>
    </div>

    <script>
        // Get DOM elements
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const transcriptDisplay = document.getElementById('transcript-display');
        const instructionsPara = document.getElementById('instructions');
        const dateDisplay = document.getElementById('date-display');

        // Global variables
        let recognition;
        let isListening = false;

        // Function to get the current timestamp in 12-hour format
        function getCurrentTimestamp() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            return `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        }

        // Function to get the current date in a readable format
        function getCurrentDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return now.toLocaleDateString(undefined, options);
        }

        // Function to add a transcript entry with a timestamp to the display
        function addTranscriptEntry(transcript) {
            const timestamp = getCurrentTimestamp();
            const entry = document.createElement('div');
            entry.classList.add('transcript-entry');
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${transcript}`;
            transcriptDisplay.appendChild(entry);
            transcriptDisplay.scrollTop = transcriptDisplay.scrollHeight; // Auto-scroll to bottom
        }

        // Function to start speech recognition
        function startRecognition() {
            if (isListening) return; // Prevent multiple instances

            transcriptDisplay.innerHTML = ''; // Clear previous transcript
            dateDisplay.textContent = getCurrentDate(); // Display the date
            instructionsPara.textContent = 'Listening for PA System...';
            isListening = true;

            startButton.disabled = true;
            stopButton.disabled = false;

            recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; // You can change the language here

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        addTranscriptEntry(finalTranscript.trim());
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                // Optionally display interim results if needed
                // resultDiv.innerHTML = finalTranscript + '<span style="color:#999;">' + interimTranscript + '</span>';
            };

            recognition.onstart = () => {
                instructionsPara.textContent = 'Listening for PA System...';
            };

            recognition.onspeechend = () => {
                // Consider what should happen after speech ends (e.g., stay listening)
            };

            recognition.onerror = (event) => {
                instructionsPara.textContent = 'Error: ' + event.error;
                stopRecognition();
            };

            recognition.start();
        }

        // Function to stop speech recognition
        function stopRecognition() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isListening = false;

            startButton.disabled = false;
            stopButton.disabled = true;
            instructionsPara.textContent = 'Stopped listening.';
        }

        // Event Listeners
        startButton.addEventListener('click', startRecognition);
        stopButton.addEventListener('click', stopRecognition);

        // Display the initial date when the page loads
        dateDisplay.textContent = getCurrentDate();
    </script>
</body>
</html>
