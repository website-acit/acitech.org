<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoscribe - Speech to Text with Siri Glow</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f8;
            color: #333;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; /* For absolute positioning of the glow */
        }

        h1 {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        h1 img {
            height: 100px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #273a4e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1a2938;
        }

        #instructions {
            color: #777;
            margin-bottom: 15px;
            font-style: italic;
        }

        #live-transcript-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        #live-transcript-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        #transcript-display {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.5;
        }

        .transcript-entry {
            margin-bottom: 8px;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-right: 10px;
        }

        #date-display {
            color: #777;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-align: center;
        }

        .siri-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Don't interfere with clicks */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .siri-glow::before,
        .siri-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
        }

        .siri-glow::before {
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background-color: #007aff; /* Siri blue */
            box-shadow: 0 0 20px #007aff;
        }

        .siri-glow::after {
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #f44336; /* Siri red */
            box-shadow: 0 0 15px #f44336;
        }

        .siri-glow.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1><img src="ChronoScribe.PNG" alt="Chronoscribe Logo"></h1>
    <div class="controls">
        <button id="startButton">Start Listening</button>
        <button id="stopButton" disabled>Stop Listening</button>
    </div>
    <p id="instructions">Press 'Start Listening' to begin.</p>
    <div id="live-transcript-container">
        <div id="date-display"></div>
        <div id="live-transcript-title">Live Transcript with Timestamps</div>
        <div id="transcript-display"></div>
    </div>
    <div id="siriGlow" class="siri-glow"></div>

    <script>
        // Get DOM elements
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const transcriptDisplay = document.getElementById('transcript-display');
        const instructionsPara = document.getElementById('instructions');
        const dateDisplay = document.getElementById('date-display');
        const siriGlow = document.getElementById('siriGlow');

        // Global variables
        let recognition;
        let isListening = false;
        const logKey = 'chronoscribeLog';
        const silenceDetectionTime = 5000; // 5 seconds
        let silenceTimeout;
        let hasSpokenSinceSilence = false;

        // Function to get the current timestamp in 12-hour format
        function getCurrentTimestamp() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            return `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        }

        // Function to get the current date in YYYY-MM-DD format for comparison
        function getCurrentDateYYYYMMDD() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Function to get the current date in a readable format
        function getCurrentDateReadable() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return now.toLocaleDateString(undefined, options);
        }

        // Function to load the log from local storage
        function loadLog() {
            const storedLog = localStorage.getItem(logKey);
            if (storedLog) {
                transcriptDisplay.innerHTML = storedLog;
            }
            displayCurrentDate();
            checkAndClearLog();
        }

        // Function to save the log to local storage
        function saveLog() {
            localStorage.setItem(logKey, transcriptDisplay.innerHTML);
        }

        // Function to add a transcript entry with a timestamp to the display and save
        function addTranscriptEntry(transcript) {
            const timestamp = getCurrentTimestamp();
            const entry = document.createElement('div');
            entry.classList.add('transcript-entry');
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${transcript}`;
            transcriptDisplay.appendChild(entry);
            transcriptDisplay.scrollTop = transcriptDisplay.scrollHeight; // Auto-scroll to bottom
            saveLog();
        }

        // Function to display the current date
        function displayCurrentDate() {
            dateDisplay.textContent = getCurrentDateReadable();
        }

        // Function to check if the log needs to be cleared based on the date
        function checkAndClearLog() {
            const lastClearDate = localStorage.getItem('lastClearDate');
            const currentDate = getCurrentDateYYYYMMDD();

            if (lastClearDate !== currentDate) {
                transcriptDisplay.innerHTML = ''; // Clear the log
                localStorage.setItem('lastClearDate', currentDate); // Update the last clear date
                saveLog(); // Save the cleared log (empty)
            }
            displayCurrentDate(); // Ensure the date is always current
        }

        function activateSiriGlow() {
            siriGlow.classList.add('active');
            setTimeout(() => {
                siriGlow.classList.remove('active');
            }, 1000); // Adjust duration as needed
        }

        function resetSilenceTimer() {
            clearTimeout(silenceTimeout);
            silenceTimeout = setTimeout(() => {
                if (!hasSpokenSinceSilence && isListening) {
                    activateSiriGlow();
                }
                hasSpokenSinceSilence = false; // Reset after silence detection
            }, silenceDetectionTime);
            hasSpokenSinceSilence = true; // Voice was heard, reset the silence trigger
        }

        // Function to start speech recognition
        function startRecognition() {
            if (isListening) return;

            instructionsPara.textContent = 'Listening for PA System...';
            isListening = true;
            hasSpokenSinceSilence = false; // Reset on start

            startButton.disabled = true;
            stopButton.disabled = false;
            transcriptDisplay.innerHTML = ''; // Clear previous transcript
            dateDisplay.textContent = getCurrentDateReadable(); // Display the date

            recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                resetSilenceTimer();
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        addTranscriptEntry(finalTranscript.trim());
                    }
                }
            };

            recognition.onstart = () => {
                instructionsPara.textContent = 'Listening for PA System...';
                resetSilenceTimer();
            };

            recognition.onspeechend = () => {
                // Consider what should happen after speech ends
            };

            recognition.onerror = (event) => {
                instructionsPara.textContent = 'Error: ' + event.error;
                stopRecognition();
            };

            recognition.start();
        }

        // Function to stop speech recognition
        function stopRecognition() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isListening = false;
            clearTimeout(silenceTimeout);

            startButton.disabled = false;
            stopButton.disabled = true;
            instructionsPara.textContent = 'Stopped listening.';
        }

        // Event Listeners
        startButton.addEventListener('click', startRecognition);
        stopButton.addEventListener('click', stopRecognition);

        // Load the log when the page loads
        loadLog();
    </script>
</body>
</html>
