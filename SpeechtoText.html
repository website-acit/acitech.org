<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Speech to Text</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        header {
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        header h1 i {
            margin-right: 0.5rem;
        }

        header .tagline {
            color: #777;
            font-size: 1rem;
        }

        main {
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .button {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .button i {
            font-size: 1.1rem;
        }

        .button.primary {
            background-color: #007bff;
            color: white;
        }

        .button.primary:hover {
            background-color: #0056b3;
        }

        .button.secondary {
            background-color: #6c757d;
            color: white;
        }

        .button.secondary:hover {
            background-color: #545b62;
        }

        .instructions {
            color: #555;
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .result-box {
            background-color: #e9ecef;
            padding: 1.5rem;
            border-radius: 8px;
            white-space: pre-wrap; /* Preserve formatting and handle long text */
            text-align: left;
            min-height: 80px;
        }

        footer {
            color: #777;
            font-size: 0.9rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-microphone"></i> Speech to Text</h1>
            <p class="tagline">Effortlessly convert your voice to text.</p>
        </header>

        <main>
            <div class="controls">
                <button id="startButton" class="button primary"><i class="fas fa-record-vinyl"></i> Start Listening</button>
                <button id="downloadButton" class="button secondary"><i class="fas fa-download"></i> Download Text</button>
            </div>
            <div id="instructions" class="instructions">Press "Start Listening" to begin.</div>
            <div id="result" class="result-box"></div>
        </main>

        <footer>
            <p>&copy; 2025 Modern Speech to Text</p>
        </footer>
    </div>

    <script>
        // Get DOM elements
        const startButton = document.getElementById('startButton');
        const resultDiv = document.getElementById('result');
        const instructionsPara = document.getElementById('instructions');
        const downloadButton = document.getElementById('downloadButton'); // Get the new download button

        // Global variables
        let recognition;
        let finalTranscript = '';
        let silenceTimeout;
        let isListening = false;

        // Function to start speech recognition
        function startRecognition() {
            if (isListening) return; // Prevent multiple instances

            resultDiv.innerHTML = '';
            instructionsPara.textContent = 'Listening...';
            finalTranscript = ''; // Reset transcript
            isListening = true;

            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; // You can change the language here

            // Reset silence timer on any speech
            recognition.onresult = (event) => {
                resetSilenceTimer();
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                resultDiv.innerHTML = finalTranscript + '<span style="color:#ddd;">' + interimTranscript + '</span>';
            };

            recognition.onstart = () => {
                instructionsPara.textContent = 'Listening...';
                resetSilenceTimer(); // Start the timer when recognition starts
            };

            recognition.onspeechend = () => {
                instructionsPara.textContent = 'Stopped listening.';
                // Do NOT stop recognition here, the timer will handle it
            };

            recognition.onerror = (event) => {
                instructionsPara.textContent = 'Error: ' + event.error;
                stopRecognition();
            };

            recognition.start();
        }

        // Function to stop speech recognition
        function stopRecognition() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isListening = false;
            clearTimeout(silenceTimeout); // Clear any pending timeout
        }

        // Function to create and download the text file
        function downloadTranscript() {
            if (!finalTranscript.trim()) {
                instructionsPara.textContent = "No transcript to download.";
                return;
            }

            const blob = new Blob([finalTranscript], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'transcript.txt';
            document.body.appendChild(a); // Append, trigger, and remove
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url); // Clean up
            instructionsPara.textContent = "Transcript downloaded.";
        }

        // Function to reset the silence timer
        function resetSilenceTimer() {
            clearTimeout(silenceTimeout); // Clear any existing timer
            silenceTimeout = setTimeout(handleSilence, 30000); // 30 seconds (30000 ms)
        }

        // Function to handle silence
        function handleSilence() {
            stopRecognition(); // Stop recognition
            instructionsPara.textContent = 'Silence detected. Processing transcript...';
            downloadTranscript(); // Create and download file
        }

        // Event Listeners
        startButton.addEventListener('click', startRecognition);
        downloadButton.addEventListener('click', downloadTranscript); // Add listener for the download button
    </script>
</body>
</html>
