<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoscribe - Speech to Text with Grouped Transcripts</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f8;
            color: #333;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: background-color 0.3s ease-in-out;
        }

        body.transcribing-bg {
            background-color: #e0f7fa;
        }

        h1 {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        h1 img {
            height: 100px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #273a4e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1a2938;
        }

        #instructions {
            color: #777;
            margin-bottom: 15px;
            font-style: italic;
        }

        #live-transcript-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: border 0.2s ease-in-out;
        }

        #live-transcript-container.transcribing-border {
            border: 2px solid #00c853;
        }

        #live-transcript-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        #transcript-display {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.5;
        }

        .transcript-group {
            margin-bottom: 15px;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-right: 10px;
            display: block;
        }

        #date-display {
            color: #777;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1><img src="ChronoScribe.PNG" alt="Chronoscribe Logo"></h1>
    <div class="controls">
        <button id="startButton">Start Listening</button>
        <button id="stopButton" disabled>Stop Listening</button>
    </div>
    <p id="instructions">Press 'Start Listening' to begin.</p>
    <div id="live-transcript-container">
        <div id="date-display"></div>
        <div id="live-transcript-title">Live Transcript with Timestamps</div>
        <div id="transcript-display"></div>
    </div>

    <script>
        // Get DOM elements
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const transcriptDisplay = document.getElementById('transcript-display');
        const instructionsPara = document.getElementById('instructions');
        const dateDisplay = document.getElementById('date-display');
        const bodyElement = document.body;
        const transcriptContainer = document.getElementById('live-transcript-container');

        // Global variables
        let recognition;
        let isListening = false;
        const logKey = 'chronoscribeLog';
        const silenceDetectionTime = 5000;
        let silenceTimeout;
        let hasSpokenSinceSilence = false;
        let currentMinute = '';
        let transcriptGroup = null;

        // Function to get the current timestamp in 12-hour format
        function getCurrentTimestamp() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
        }

        function getCurrentMinute() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}-${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}`;
        }

        // Function to get the current date in YYYY-MM-DD format for comparison
        function getCurrentDateYYYYMMDD() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Function to get the current date in a readable format
        function getCurrentDateReadable() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return now.toLocaleDateString(undefined, options);
        }

        // Function to load the log from local storage
        function loadLog() {
            const storedLog = localStorage.getItem(logKey);
            if (storedLog) {
                transcriptDisplay.innerHTML = storedLog;
            }
            displayCurrentDate();
            checkAndClearLog();
        }

        // Function to save the log to local storage
        function saveLog() {
            localStorage.setItem(logKey, transcriptDisplay.innerHTML);
        }

        function indicateTranscribing() {
            bodyElement.classList.add('transcribing-bg');
            transcriptContainer.classList.add('transcribing-border');
            setTimeout(() => {
                bodyElement.classList.remove('transcribing-bg');
                transcriptContainer.classList.remove('transcribing-border');
            }, 300);
        }

        // Function to add a transcript entry with a timestamp to the display and save
        function addTranscriptEntry(transcript) {
            const minute = getCurrentMinute();
            const timestamp = getCurrentTimestamp();

            if (minute !== currentMinute) {
                currentMinute = minute;
                if (transcriptGroup) {
                    saveLog(); // Save the previous group
                }
                transcriptGroup = document.createElement('div');
                transcriptGroup.classList.add('transcript-group');
                transcriptGroup.innerHTML = `<span class="timestamp">${timestamp}</span>`;
                transcriptDisplay.appendChild(transcriptGroup);
            }
            transcriptGroup.innerHTML += ` ${transcript}`;
            transcriptDisplay.scrollTop = transcriptDisplay.scrollHeight;
        }

        // Function to display the current date
        function displayCurrentDate() {
            dateDisplay.textContent = getCurrentDateReadable();
        }

        // Function to check if the log needs to be cleared based on the date
        function checkAndClearLog() {
            const lastClearDate = localStorage.getItem('lastClearDate');
            const currentDate = getCurrentDateYYYYMMDD();

            if (lastClearDate !== currentDate) {
                transcriptDisplay.innerHTML = '';
                localStorage.setItem('lastClearDate', currentDate);
                saveLog();
            }
            displayCurrentDate();
        }

        function resetSilenceTimer() {
            clearTimeout(silenceTimeout);
            silenceTimeout = setTimeout(() => {
                if (!hasSpokenSinceSilence && isListening) {
                }
                hasSpokenSinceSilence = false;
            }, silenceDetectionTime);
            hasSpokenSinceSilence = true;
        }

        // Function to start speech recognition
        function startRecognition() {
            if (isListening) return;

            instructionsPara.textContent = 'Listening for PA System...';
            isListening = true;
            hasSpokenSinceSilence = false;
            currentMinute = getCurrentMinute();
            transcriptGroup = document.createElement('div');
            transcriptGroup.classList.add('transcript-group');
            transcriptDisplay.appendChild(transcriptGroup);

            startButton.disabled = true;
            stopButton.disabled = false;
            transcriptDisplay.innerHTML = '';
            dateDisplay.textContent = getCurrentDateReadable();

            recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                resetSilenceTimer();
                indicateTranscribing();
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        addTranscriptEntry(finalTranscript.trim());
                    }
                }
            };

            recognition.onstart = () => {
                instructionsPara.textContent = 'Listening for PA System...';
                resetSilenceTimer();
            };

            recognition.onspeechend = () => {
                // Consider what should happen after speech ends
            };

            recognition.onerror = (event) => {
                instructionsPara.textContent = 'Error: ' + event.error;
                stopRecognition();
            };

            recognition.start();
        }

        // Function to stop speech recognition
        function stopRecognition() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isListening = false;
            clearTimeout(silenceTimeout);
            bodyElement.classList.remove('transcribing-bg');
            transcriptContainer.classList.remove('transcribing-border');
            if (transcriptGroup) {
                saveLog();
            }
            startButton.disabled = false;
            stopButton.disabled = true;
            instructionsPara.textContent = 'Stopped listening.';
        }

        // Event Listeners
        startButton.addEventListener('click', startRecognition);
        stopButton.addEventListener('click', stopRecognition);

        // Load the log when the page loads
        loadLog();
    </script>
</body>
</html>
