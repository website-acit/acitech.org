<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoscribe - Speech to Text</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Chronoscribe</h1>
    <div class="controls">
        <button id="startButton">Start Listening</button>
        <button id="stopButton" disabled>Stop Listening</button>
        <button id="downloadButton" disabled>Save Transcript</button>
    </div>
    <p id="instructions">Press 'Start Listening' to begin.</p>
    <div id="result-container">
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
