<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoscribe - Speech to Text with Daily Log Clear</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f8;
            color: #333;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            /* Remove the text-based title */
            margin-bottom: 20px;
            display: flex; /* To center the image if needed */
            justify-content: center; /* To center the image horizontally */
        }

        h1 img {
            /* Style for the image logo */
            height: 80px; /* Increased the height - adjust as needed */
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        #instructions {
            color: #777;
            margin-bottom: 15px;
            font-style: italic;
        }

        #live-transcript-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        #live-transcript-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        #transcript-display {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.5;
        }

        .transcript-entry {
            margin-bottom: 8px;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-right: 10px;
        }

        #date-display {
            color: #777;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1><img src="ChronoScribe.PNG" alt="Chronoscribe Logo"></h1>
    <div class="controls">
        <button id="startButton">Start Listening</button>
        <button id="stopButton" disabled>Stop Listening</button>
    </div>
    <p id="instructions">Press 'Start Listening' to begin.</p>
    <div id="live-transcript-container">
        <div id="date-display"></div>
        <div id="live-transcript-title">Live Transcript with Timestamps</div>
        <div id="transcript-display"></div>
    </div>

    <script>
        // ... (rest of your JavaScript code remains the same) ...
    </script>
</body>
</html>
