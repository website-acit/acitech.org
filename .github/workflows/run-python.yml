# .github/workflows/run-python.yml

# Name of the workflow (shows up in the Actions tab)
name: Run ITDepartmentResources.py

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Defines a job named 'build' (you can name it anything)
  build:
    # The type of runner that the job will run on (GitHub-hosted virtual machine)
    runs-on: ubuntu-latest # You can also use windows-latest or macos-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Step 1: Check out your repository code so the workflow can access it
    - name: Check out repository code
      uses: actions/checkout@v4 # Uses the official 'checkout' action

    # Step 2: Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5 # Uses the official 'setup-python' action
      with:
        python-version: '3.11' # Specify the Python version you need

    # Step 4: Run the Python script
    - name: Run Python script
      run: python ACT-ITDepartmentResources.py # Replace with the correct path to your script

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Stage HTML file
      run: |
        git add ACT-ITDepartmentResources.html # <-- Ensure filename is correct!

    - name: Commit HTML file
      run: |
        git diff --staged --quiet || git commit -m "Automated update: Regenerate HTML resources file"

    - name: Push changes
      run: |
        git push origin main
