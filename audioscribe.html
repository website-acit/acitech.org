<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Announcement Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f3f4f6;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #transcript {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f9ff;
            border-radius: 0.375rem;
            width: 100%;
            height: 150px;
            overflow-y: auto;
        }

        #record-button {
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
        }

        #record-button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-xl font-semibold mb-4">Voice Announcement Dashboard</h1>
        <p>Click the button and start speaking to record an announcement</p>

        <button id="record-button">Start Recording</button>
        
        <div id="transcript"></div>
    </div>

    <script>
        const recordButton = document.getElementById('record-button');
        const transcriptArea = document.getElementById('transcript');
        let recognition;
        let isRecording = false;  // Track whether recording is in progress

        // Check if SpeechRecognition is supported
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                recordButton.textContent = 'Recording...';
                isRecording = true;  // Mark as recording
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Display the transcribed text
                transcriptArea.innerHTML = finalTranscript || interimTranscript;

                if (finalTranscript) {
                    // Send final transcript to Google Sheets
                    sendTranscriptToSheet(finalTranscript);
                }
            };

            recognition.onend = () => {
                recordButton.textContent = 'Start Recording';
                isRecording = false;  // Mark as not recording
            };

            recognition.onerror = (event) => {
                console.error('Error with speech recognition:', event.error);
            };
        } else {
            alert('Speech recognition is not supported in this browser');
        }

        recordButton.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();  // Stop the current session if it's already recording
            } else {
                recognition.start();  // Start a new session
            }
        });

        function sendTranscriptToSheet(transcript) {
            // Use the correct Web App URL from Google Apps Script
            const scriptUrl = 'https://script.google.com/a/macros/acitech.org/s/AKfycbzhKZNqZmFK6HGYehSSMgvvOhpL9LHfiISj2kcuxIm5ID17bw2x1sbUBuxglqJpNeUO/exec';  // Replace with your actual Web App URL

            fetch(scriptUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'  // Ensure the correct content type
                },
                body: `message=${encodeURIComponent(transcript)}`  // Sending the message parameter
            })
            .then(response => response.text())
            .then(() => {
                console.log('Announcement saved to sheet');
            })
            .catch(error => console.error('Error sending transcript:', error));
        }
    </script>
</body>
</html>
